name: Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate build, config and migration preflight without changing Cloudflare
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Production release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SMOKE_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_URL: ${{ vars.SMOKE_URL }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('manual-{0}', github.sha) }}
      RELEASE_MESSAGE: ${{ format('{0} ({1})', github.ref_name, github.sha) }}
    steps:
      - name: Check required release configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as production environment secrets."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source and build
        run: |
          npm run check
          npm run typecheck
          npm run build:verify
          npm audit --omit=optional --audit-level=high

      - name: Verify local migration rollback
        run: npm run db:verify-rollback

      - name: Validate Worker deployment (dry-run)
        run: npx wrangler deploy --dry-run --strict --message "${RELEASE_MESSAGE}" --tag "${RELEASE_TAG}"

      - name: Migration preflight and recovery bookmark
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list margiolink --remote
          npx wrangler d1 time-travel info margiolink --json

      - name: Apply production migrations
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npx wrangler d1 migrations apply margiolink --remote

      - name: Deploy Worker
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npx wrangler deploy --strict --message "${RELEASE_MESSAGE}" --tag "${RELEASE_TAG}"

      - name: Check production smoke endpoints
        if: github.event_name == 'push' || inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SMOKE_URL:-}" ]]; then
            echo "::error::Configure production environment variable SMOKE_URL before a real release."
            exit 1
          fi
          base="${SMOKE_URL%/}"
          for endpoint in /_health /_ready; do
            body="$(curl --fail-with-body --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused --max-time 20 "${base}${endpoint}")"
            node --input-type=module -e '
              const payload = JSON.parse(process.argv[1]);
              if (payload.ok !== true) process.exit(1);
            ' "$body"
          done
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused --max-time 20 \
            --output /dev/null "${base}/"

      - name: Record deployed version
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npx wrangler deployments list --json
