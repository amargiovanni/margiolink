blank_issues_enabled: true

contact_links:
  - name: Report a security vulnerability
    url: https://github.com/amargiovanni/margiolink/security/advisories/new
    about: >-
      Please do not open a public issue for anything with security impact.
      This form is private to the maintainers. See SECURITY.md for scope and
      what to expect.

  - name: Ask a question or propose an idea
    url: https://github.com/amargiovanni/margiolink/discussions
    about: >-
      For "how do I", "should this work like that", or an idea you want to
      think through before it becomes a proposal.
